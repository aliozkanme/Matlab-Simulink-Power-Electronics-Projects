name: Update Project List

# Tetikleyici: Main branch'e push yapıldığında çalışır
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md' # Sonsuz döngüyü engellemek için README değişiminde tetiklenmesin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Scripti Çalıştır
      run: python .github/scripts/update_projects.py

    - name: Değişiklikleri Commit ve Push Yap
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add README.md
        # Eğer değişiklik varsa commit at, yoksa hata verme
        git commit -m "docs: proje listesi otomatik güncellendi" || exit 0
        git push