name: Update Project List

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v3
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Run Python Script and Update README
      shell: python
      run: |
        import os
        import re

        ROOT_DIR = "."
        MAIN_README = "README.md"
        START_MARKER = ""
        END_MARKER = ""

        def get_project_title(readme_path):
            if not os.path.exists(readme_path): return None
            with open(readme_path, 'r', encoding='utf-8') as f:
                for line in f:
                    if line.strip().startswith('# '):
                        return line.strip()[2:].strip()
            return None

        projects = []
        for item in os.listdir(ROOT_DIR):
            if os.path.isdir(item) and not item.startswith('.'):
                readme_path = os.path.join(item, "README.md")
                if os.path.exists(readme_path):
                    title = get_project_title(readme_path)
                    if title:
                        projects.append(f"- [{title}](./{item})")
        
        projects.sort()
        content_list = "\n".join(projects)
        
        if os.path.exists(MAIN_README):
            with open(MAIN_README, 'r', encoding='utf-8') as f:
                content = f.read()
            
            pattern = re.compile(f"{re.escape(START_MARKER)}.*?{re.escape(END_MARKER)}", re.DOTALL)
            new_content = f"{START_MARKER}\n{content_list}\n{END_MARKER}"
            updated_content = pattern.sub(new_content, content)
            
            with open(MAIN_README, 'w', encoding='utf-8') as f:
                f.write(updated_content)
            print("README güncellendi.")

    - name: Commit and Push
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add README.md
        git commit -m "docs: auto-update project list" || exit 0
        git push