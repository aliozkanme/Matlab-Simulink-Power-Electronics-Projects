name: Update Project List

on:
  push:
    branches:
      - main
      - master
    # İŞTE KİLİT NOKTA BURASI:
    # Bu ayar, sadece README.md değiştiğinde botun çalışmasını ENGELLER.
    paths-ignore:
      - 'README.md' 
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v3
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Scripti Calistir
      shell: python
      run: |
        import os
        import re

        ROOT_DIR = "."
        MAIN_README = "README.md"
        START_MARKER = ""
        END_MARKER = ""

        # 1. Projeleri Bul
        projects = []
        # Klasörleri isme göre sırala
        for item in sorted(os.listdir(ROOT_DIR)):
            if os.path.isdir(item) and not item.startswith('.'):
                readme_path = os.path.join(item, "README.md")
                if os.path.exists(readme_path):
                    title = item
                    # Başlığı çekmeyi dene
                    try:
                        with open(readme_path, 'r', encoding='utf-8') as f:
                            for line in f:
                                if line.strip().startswith('# '):
                                    title = line.strip()[2:].strip()
                                    break
                    except:
                        pass
                    projects.append(f"- [{title}](./{item})")

        # Yeni içerik bloğunu hazırla
        new_content_block = f"{START_MARKER}\n" + "\n".join(projects) + f"\n{END_MARKER}"

        # 2. Dosyayı Oku ve Değiştir
        if os.path.exists(MAIN_README):
            with open(MAIN_README, 'r', encoding='utf-8') as f:
                content = f.read()

            # Regex ile iki marker arasını bul
            pattern = re.compile(f"{re.escape(START_MARKER)}.*?{re.escape(END_MARKER)}", re.DOTALL)
            
            # Eğer markerlar varsa içeriği değiştir
            if pattern.search(content):
                updated_content = pattern.sub(new_content_block, content)
                
                # Sadece değişiklik varsa kaydet
                if updated_content != content:
                    with open(MAIN_README, 'w', encoding='utf-8') as f:
                        f.write(updated_content)
                    print("GUNCELLEME BASARILI: Proje listesi yenilendi.")
                else:
                    print("DEGISIKLIK YOK: Liste zaten güncel.")
            else:
                print("UYARI: Markerlar bulunamadı! Dosyaya dokunulmadı.")
                print("Lütfen README.md dosyanıza şu iki satırı ekleyin:")
                print("")
                print("")

    - name: Commit ve Push
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add README.md
        # Değişiklik varsa gönder, yoksa sessizce çık
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: proje listesi guncellendi" && git push)
