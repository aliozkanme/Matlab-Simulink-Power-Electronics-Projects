name: Update Projects List
on:
  push:
    branches:
      - main
    paths-ignore: # CRITICAL: Prevents workflow from triggering on README changes
      - 'README.md'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Required for workflow to commit changes

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and update projects list
        run: |
          python3 << 'EOF'
          import os
          import re
          
          # Collect all directories with README.md
          project_dirs = []
          for item in sorted(os.listdir('.')):
              if os.path.isdir(item) and not item.startswith('.') and item != '.github':
                  readme_path = os.path.join(item, 'README.md')
                  if os.path.exists(readme_path):
                      try:
                          with open(readme_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                              # Extract first H1 title
                              match = re.search(r'^#\s+(.+)$', content, re.MULTILINE)
                              title = match.group(1).strip() if match else item
                              project_dirs.append((item, title))
                      except Exception as e:
                          print(f"Warning: Could not read {readme_path}: {e}")
          
          # Generate markdown list
          md_list = ""
          for dir_name, title in project_dirs:
              md_list += f"- [{title}](./{dir_name})\n"
          
          # Read existing README.md
          with open('README.md', 'r', encoding='utf-8') as f:
              readme_content = f.read()
          
          start_marker = "<!-- PROJECTS-LIST:START -->"
          end_marker = "<!-- PROJECTS-LIST:END -->"
          
          # Check if markers exist
          if start_marker in readme_content and end_marker in readme_content:
              # Replace content between markers
              pattern = f"{re.escape(start_marker)}.*?{re.escape(end_marker)}"
              replacement = f"{start_marker}\n{md_list}{end_marker}"
              new_content = re.sub(pattern, replacement, readme_content, flags=re.DOTALL)
          else:
              # Append markers and content to the end
              new_content = readme_content.rstrip() + f"\n\n{start_marker}\n{md_list}{end_marker}\n"
          
          # Write back if changed
          if new_content != readme_content:
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print("README.md updated successfully!")
          else:
              print("No changes needed.")
          
          EOF

      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add README.md
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Update projects list [skip ci]" # CRITICAL: Prevents infinite loop
            git push
            echo "Changes pushed successfully"
          fi
